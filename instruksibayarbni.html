<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Binar Car Rental</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>   

        <!-- Section 1 -->
        <div class="car-wrapper">
            <header class="navbar">
                <div class="logo"></div>

                <!-- Desktop -->
                <div class="nav-container">
                    <ul class="navmenu">
                        <li><a href="#services">Our Service</a></li>
                        <li><a href="#why-us">Why Us</a></li>
                        <li><a href="#testimonial">Testimonial</a></li>
                        <li><a href="#faq">FAQ</a></li>
                    </ul>
                    <button class="btn-register" type="button">Register</button>
                </div>

                <!-- Mobile -->
                <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </header>

            <!-- Bar Navigasi Pembayaran -->
             <div class="payment-step-bar">
                <div class="step-back-title">
                    <button class="btn-back" type="button" aria-label="Kembali">&#8592;</button>
                    <h6>BCA Transfer</h6>
                </div>
                <div class="stepper">
                    <div class="step active">
                        <span class="step-number">1</span>
                        <span class="step-text">Pilih Metode</span>
                    </div>
                    <span class="step-line"></span>
                    <div class="step active">
                        <span class="step-number">2</span>
                        <span class="step-text">Bayar</span>
                    </div>
                    <span class="step-line"></span>
                    <div class="step">
                        <span class="step-number">3</span>
                        <span class="step-text">Tiket</span>
                    </div>
                </div>
             </div>
        </div>




<footer class="footer">

        <p>Jalan Suroyo No. 161 Mayangan Kota Probolonggo 672000</p>
        <p>binarcarrental@gmail.com</p>
        <p>081-233-334-808</p>
    </div>

    <!-- Kolom 2: Navigasi Cepat -->
    <div class="footer-col footer-nav">
        <ul>
            <li><a href="#services">Our Services</a></li>

    <div class="footer-col footer-copyright">

        <div class="logo"></div>
    </div>
