<script>
    const dataPenjualanNovel = [
        {
            idProduct: "BOOK002421",
            namaProduk: "Pulang Pergi",
            penulis: "Tere Liye",
            hargaBeli: 60000,
            hargaJual: 86000,
            totalTerjual: 150,
            sisaStok: 17
        },
        {
            idProduct: "BOOK002351",
            namaProduk: "Selamat Tinggal",
            penulis: "Tere Liye",
            hargaBeli: 75000,
            hargaJual: 103000,
            totalTerjual: 171,
            sisaStok: 20
        },
        {
            idProduct: "BOOK002941",
            namaProduk: "Garis Waktu",
            penulis: "Fiersa Besari",
            hargaBeli: 67000,
            hargaJual: 99000,
            totalTerjual: 213,
            sisaStok: 5
        },
        {
            idProduct: "BOOK002941",
            namaProduk: "Laskar Pelangi",
            penulis: "Andrea Hirata",
            hargaBeli: 55000,
            hargaJual: 68000,
            totalTerjual: 20,
            sisaStok: 56
        }
    ];

    const formatRupiah = angka => new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        minimumFractionDigits: 0
    }).format(angka).replace("Rp", "Rp.");

    function getInfoPenjualan(dataPenjualan) {
        if (dataPenjualan === undefined) {
            return "ERROR: Parameter missing";
        }

        if (!Array.isArray(dataPenjualan)) {
            return "ERROR: Expected an array";
        }

        let totalModal = 0;
        let totalKeuntungan = 0;
        let maxTerjual = 0;
        let produkBukuTerlaris = "";
        const penulisPenjualan = {};

        for (const item of dataPenjualan) {
            const stokAwal = item.totalTerjual + item.sisaStok;
            const modalProduk = stokAwal * item.hargaBeli;
            const pendapatanProduk = item.totalTerjual * item.hargaJual;

            totalModal += modalProduk;
            totalKeuntungan += pendapatanProduk - item.totalTerjual * item.hargaBeli;

            if (item.totalTerjual > maxTerjual) {
                maxTerjual = item.totalTerjual;
                produkBukuTerlaris = item.namaProduk;
            }

            penulisPenjualan[item.penulis] =
                (penulisPenjualan[item.penulis] || 0) + item.totalTerjual;
        }

        let penulisTerlaris = "";
        let maxPenulisTerjual = 0;
        for (const penulis in penulisPenjualan) {
            if (penulisPenjualan[penulis] > maxPenulisTerjual) {
                maxPenulisTerjual = penulisPenjualan[penulis];
                penulisTerlaris = penulis;
            }
        }

        return {
            totalKeuntungan: formatRupiah(totalKeuntungan),
            totalModal: formatRupiah(totalModal),
            persentaseKeuntungan: `${((totalKeuntungan / totalModal) * 100).toFixed(2)}%`,
            produkBukuTerlaris,
            penulisTerlaris
        };
    }

    console.log(getInfoPenjualan(dataPenjualanNovel));
</script>
