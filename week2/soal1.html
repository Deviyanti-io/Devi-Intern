
    <script>
        function changeWord(selectedText, changedText, text) {
          return text.replace(selectedText, changedText);
        }
        const kalimat1 = 'Putra putri bangsa Indonesia menjadi kebanggaan dunia';
        const kalimat2 = 'Sejarah Negara Republik Indonesia dimulai sejak sebelum kita lahir';
        console.log(changeWord('menjadi', 'nomor 1', kalimat1));
        console.log(changeWord('lahir', 'hadir', kalimat2));
        
 </script>
