<script>
    function route(n, edges, start, end) { // mengatur rute dari start ke end
        if (start === end) {
            return 0;
        }
        var jalan = []; // array untuk menyimpan jalur antar node
        for (var i = 0; i < n; i++) { 
            jalan[i] = []; 
        }
        for (var i = 0; i < edges.length; i++) {
            var a = edges[i][0]; 
            var b = edges[i][1];
            jalan[a].push(b);
            jalan[b].push(a);
        }
        var antrian = [start]; 
        var langkah = [];
        for (var i = 0; i < n; i++) { // inisialisasi langkah untuk setiap node
            langkah[i] = -1; 
        }
        langkah[start] = 0; 
        while (antrian.length > 0) {
            var sekarang = antrian.shift();

            for (var i = 0; i < jalan[sekarang].length; i++) { 
                var berikutnya = jalan[sekarang][i];

                if (langkah[berikutnya] === -1) {
                    langkah[berikutnya] = langkah[sekarang] + 1;
                    if (berikutnya === end) {
                        return langkah[berikutnya];
                    }
                    antrian.push(berikutnya); 
                }
            }
        }
        return -1;
    }
    console.log(route(5, [[0, 1], [0, 2], [1, 2], [1, 3], [2, 4]], 1, 4)); // Output: 2 
    console.log(route(5, [[0, 1], [0, 2], [1, 2], [1, 3], [2, 4]], 0, 4)); // Output: 2
    console.log(route(5, [[0, 1], [0, 2], [1, 2], [1, 3], [2, 4]], 2, 4)); // Output: 0
</script>
